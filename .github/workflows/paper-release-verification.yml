name: Paper release verification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify-paper-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verifier dependency
        run: python -m pip install --upgrade pip pandas==2.2.3
      - name: Verify released paper artifacts
        run: python scripts/verify_paper_release.py
